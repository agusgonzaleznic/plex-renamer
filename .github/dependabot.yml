# Weekly updates for the pinned actions and reusable workflows in .github/workflows. The build
# lock in requirements/ is regenerated by hand (see its header); Dependabot alerts still cover
# every package in it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # A new release waits a week before Dependabot proposes it.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
