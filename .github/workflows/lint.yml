# Lints the workflows and proves every action pin, on every pull request and push to main, with
# the shared actions-lint.yml.

name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "Lint" is half of the main ruleset's required checks ("Lint / actionlint", "Lint / Verify
  # action pins"): renaming it is a breaking change.
  lint:
    name: Lint
    uses: agusgonzaleznic/github-reusable-workflows/.github/workflows/actions-lint.yml@0938feb26149788717c639af3d1cf1f3a96ca2c8 # v1.12.0
